name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n on every script
        run: |
          set -euo pipefail
          for f in bin/mercury lib/*.sh sandbox/entrypoint.sh scripts/*.sh; do
            bash -n "$f" && echo "OK: $f"
          done
      - name: shellcheck
        # SC1091: .env is sourced at runtime and does not exist in CI
        run: shellcheck -S warning -e SC1091 bin/mercury lib/*.sh sandbox/entrypoint.sh scripts/*.sh

  python:
    name: mercuryd tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m py_compile mercuryd/server.py
      - run: python3 -m unittest discover -s mercuryd -v

  compose:
    name: Compose file validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config (default, tunnel profile, virtual keys override)
        run: |
          docker compose -f compose.yaml --env-file .env.example config -q
          COMPOSE_PROFILES=tunnel docker compose -f compose.yaml --env-file .env.example config --services | grep -qx cloudflared
          LITELLM_DB_PASSWORD=pw docker compose -f compose.yaml -f compose.keys.yaml \
            --env-file .env.example config --services | grep -qx gateway-db

  site:
    name: Docs site builds and links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.152.0"
          extended: true
      - run: hugo --source site --gc --minify --panicOnWarning
      - name: every internal link resolves
        run: python3 site/check-links.py site/public /MercurySandbox/

  helm:
    name: Helm chart lint and schema check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint, defaults and everything enabled
        run: |
          set -euo pipefail
          helm lint charts/mercury --set secrets.litellmMasterKey=sk-ci
          helm lint charts/mercury --set secrets.litellmMasterKey=sk-ci \
            --set gateway.virtualKeys.enabled=true --set gateway.virtualKeys.bundledPostgres.enabled=true \
            --set secrets.litellmDbPassword=pw --set sandbox.githubApp.appId=1 \
            --set sandbox.githubApp.installationId=2 --set secrets.githubAppPrivateKey=pem \
            --set sandbox.rules=x --set controller.ingress.enabled=true --set 'imagePullSecrets[0].name=ghcr'
      - name: kubeconform on the rendered manifests
        run: |
          set -euo pipefail
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar -xz kubeconform
          helm template mercury charts/mercury --namespace agents --set secrets.litellmMasterKey=sk-ci \
            --set gateway.virtualKeys.enabled=true --set gateway.virtualKeys.bundledPostgres.enabled=true \
            --set secrets.litellmDbPassword=pw --set sandbox.githubApp.appId=1 \
            --set sandbox.githubApp.installationId=2 --set secrets.githubAppPrivateKey=pem \
            --set sandbox.rules=x --set controller.ingress.enabled=true | ./kubeconform -strict -summary
      - name: chart version matches VERSION
        run: |
          set -euo pipefail
          v="$(cat VERSION)"
          # release-please rewrites these lines and may drop the quotes
          grep -qE "^version: \"?$v\"?$" charts/mercury/Chart.yaml
          grep -qE "^appVersion: \"?$v\"?$" charts/mercury/Chart.yaml

  docker:
    name: Dockerfile lint and smoke builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - name: hadolint (sandbox)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: sandbox/Dockerfile
      - name: hadolint (gateway)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: gateway/Dockerfile
      - uses: docker/setup-buildx-action@v3
      - name: Smoke-build controller image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mercury:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-build sandbox image (no push)
        uses: docker/build-push-action@v6
        with:
          context: sandbox
          push: false
          tags: mercury-sandbox:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Controller image answers help and health
        run: |
          set -euo pipefail
          docker run --rm mercury:ci help | grep -q 'safe playground'
          docker run --rm mercury:ci version | grep -qx "$(cat VERSION)"
          cid="$(docker run -d -e LITELLM_MASTER_KEY=ci mercury:ci serve)"
          for _ in $(seq 1 20); do
            if docker exec "$cid" curl -fsS http://127.0.0.1:5004/api/health | grep -q '"ok": true'; then
              echo "mercuryd healthy"; docker rm -f "$cid" >/dev/null; exit 0
            fi
            sleep 1
          done
          docker logs "$cid"; docker rm -f "$cid" >/dev/null; exit 1

  cli:
    name: mercury CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./bin/mercury help
      - run: ./bin/mercury version
      - run: ./bin/mercury sandbox --help
      - name: unknown command exits non-zero
        run: |
          if ./bin/mercury no-such-command 2>/dev/null; then
            echo "expected failure for unknown command" >&2
            exit 1
          fi
      - name: up refuses without .env
        run: |
          if ./bin/mercury up 2>/dev/null; then
            echo "expected failure without .env" >&2
            exit 1
          fi
