name: Publish images

# Two images go to GHCR:
#   ghcr.io/<owner>/mercury          the controller (CLI + mercuryd), which the
#                                    Home Assistant add-on builds FROM
#   ghcr.io/<owner>/mercury-sandbox  the throwaway opencode sandbox
#
# Tags: a push to main publishes "edge" and "sha-<commit>"; a release tag
# vX.Y.Z publishes "X.Y.Z" and "latest". Pin add-ons and servers to X.Y.Z.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mercury
            context: .
          - image: mercury-sandbox
            context: sandbox
    steps:
      - uses: actions/checkout@v4
      - name: Refuse a tag that does not match VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$(cat VERSION)" ]; then
            echo "tag v$tag does not match VERSION $(cat VERSION)" >&2
            exit 1
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
