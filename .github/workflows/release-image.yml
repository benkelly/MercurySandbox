name: Publish images and chart

# Three artifacts go to GHCR:
#   ghcr.io/<owner>/mercury          the controller (CLI + mercuryd), which the
#                                    Home Assistant add-on builds FROM
#   ghcr.io/<owner>/mercury-sandbox  the throwaway opencode sandbox
#   oci://ghcr.io/<owner>/charts/mercury   the Helm chart, releases only
#
# Tags: a push to main publishes "edge" and "sha-<commit>" images. A release
# (release-please calling this workflow with a version, a vX.Y.Z tag pushed
# by hand, or a dispatch with a version) publishes "X.Y.Z" and "latest"
# images plus the chart at X.Y.Z. Pin add-ons and servers to X.Y.Z.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Publish X.Y.Z and latest from the current ref (must equal VERSION); blank publishes edge
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (the release tag)
        required: true
        type: string
      version:
        description: Version to tag the images with (X.Y.Z)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  version:
    name: Work out the release version, if this is one
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.rel.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - id: rel
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=""
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [ -n "$version" ] && [ "$version" != "$(cat VERSION)" ]; then
            echo "release $version does not match VERSION $(cat VERSION)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  images:
    name: ${{ matrix.image }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mercury
            context: .
          - image: mercury-sandbox
            context: sandbox
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.version != '' }}
            type=raw,value=latest,enable=${{ needs.version.outputs.version != '' }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' && needs.version.outputs.version == '' }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  chart:
    name: Helm chart
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: azure/setup-helm@v4
      - name: Package and push to GHCR as an OCI artifact
        env:
          VERSION: ${{ needs.version.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="$(tr '[:upper:]' '[:lower:]' <<<"$OWNER")"
          helm lint charts/mercury --set secrets.litellmMasterKey=sk-ci
          helm package charts/mercury --version "$VERSION" --app-version "$VERSION" --destination dist
          helm registry login ghcr.io -u "$ACTOR" --password-stdin <<<"$TOKEN"
          helm push "dist/mercury-${VERSION}.tgz" "oci://ghcr.io/${owner}/charts"
          echo "published oci://ghcr.io/${owner}/charts/mercury:${VERSION}"
