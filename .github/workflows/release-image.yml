name: Publish images

# Two images go to GHCR:
#   ghcr.io/<owner>/mercury          the controller (CLI + mercuryd), which the
#                                    Home Assistant add-on builds FROM
#   ghcr.io/<owner>/mercury-sandbox  the throwaway opencode sandbox
#
# Tags: a push to main publishes "edge" and "sha-<commit>". A release
# (release-please calling this workflow with a version, or a vX.Y.Z tag
# pushed by hand) publishes "X.Y.Z" and "latest". Pin add-ons and servers
# to X.Y.Z.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Publish X.Y.Z and latest from the current ref (must equal VERSION); blank publishes edge
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (the release tag)
        required: true
        type: string
      version:
        description: Version to tag the images with (X.Y.Z)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mercury
            context: .
          - image: mercury-sandbox
            context: sandbox
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Work out the release version, if this is one
        id: rel
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=""
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [ -n "$version" ] && [ "$version" != "$(cat VERSION)" ]; then
            echo "release $version does not match VERSION $(cat VERSION)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.rel.outputs.version }},enable=${{ steps.rel.outputs.version != '' }}
            type=raw,value=latest,enable=${{ steps.rel.outputs.version != '' }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' && steps.rel.outputs.version == '' }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
