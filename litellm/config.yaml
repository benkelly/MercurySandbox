# LiteLLM proxy config. Clients (Hermes, opencode, opencode-manager) call
# http://gateway:4000/v1 with the master key and pick a model by name below.
# Add or swap models here, nothing else in the stack changes.

model_list:
  # Strong model for hard problems
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  # Cheap default for grunt work, swap for whatever you fancy on OpenRouter
  - model_name: cheap-default
    litellm_params:
      model: openrouter/deepseek/deepseek-chat
      api_key: os.environ/OPENROUTER_API_KEY

  # Local model via Ollama on the Mac host (uncomment if you run Ollama)
  # - model_name: local-small
  #   litellm_params:
  #     model: ollama/qwen2.5-coder:7b
  #     api_base: http://host.docker.internal:11434

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
