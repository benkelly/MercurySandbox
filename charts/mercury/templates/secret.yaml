{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mercury.fullname" . }}
  labels:
    {{- include "mercury.labels" . | nindent 4 }}
type: Opaque
stringData:
  LITELLM_MASTER_KEY: {{ required "secrets.litellmMasterKey (or secrets.existingSecret) is required" .Values.secrets.litellmMasterKey | quote }}
  {{- with .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.openrouterApiKey }}
  OPENROUTER_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.sandboxGitToken }}
  SANDBOX_GIT_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.mercuryApiToken }}
  MERCURY_API_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.githubAppPrivateKey }}
  GITHUB_APP_PRIVATE_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.litellmDbPassword }}
  LITELLM_DB_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.databaseUrl }}
  DATABASE_URL: {{ . | quote }}
  {{- end }}
{{- end }}
