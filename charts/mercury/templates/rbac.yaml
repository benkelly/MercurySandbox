{{- if .Values.rbac.create }}
# The controller creates one Job and one Secret per sandbox and reads their
# logs. Nothing cluster-wide, nothing outside its namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "mercury.fullname" . }}
  labels:
    {{- include "mercury.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mercury.fullname" . }}
  labels:
    {{- include "mercury.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "mercury.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "mercury.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
