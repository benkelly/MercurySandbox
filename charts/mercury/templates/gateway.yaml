apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mercury.gatewayName" . }}
  labels:
    {{- include "mercury.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- .Values.gateway.config | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mercury.gatewayName" . }}
  labels:
    {{- include "mercury.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: http
  selector:
    {{- include "mercury.selector" . | nindent 4 }}
    app.kubernetes.io/component: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mercury.gatewayName" . }}
  labels:
    {{- include "mercury.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "mercury.selector" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "mercury.selector" . | nindent 8 }}
        app.kubernetes.io/component: gateway
      annotations:
        checksum/config: {{ .Values.gateway.config | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: "{{ .Values.image.gateway.repository }}:{{ .Values.image.gateway.tag }}"
          imagePullPolicy: {{ .Values.image.gateway.pullPolicy }}
          args: ["--config", "/app/config.yaml", "--port", "4000"]
          ports:
            - name: http
              containerPort: 4000
          env:
            {{- $secret := include "mercury.secretName" . }}
            {{- range $k := list "LITELLM_MASTER_KEY" "ANTHROPIC_API_KEY" "OPENROUTER_API_KEY" "OPENAI_API_KEY" }}
            {{- include "mercury.secretEnv" (dict "key" $k "secret" $secret) | nindent 12 }}
            {{- end }}
            {{- if .Values.gateway.virtualKeys.enabled }}
            {{- if .Values.gateway.virtualKeys.bundledPostgres.enabled }}
            - name: LITELLM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: LITELLM_DB_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://litellm:$(LITELLM_DB_PASSWORD)@{{ include "mercury.dbName" . }}:5432/litellm"
            {{- else }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: DATABASE_URL
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "mercury.gatewayName" . }}
